<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;display=swap');
      .logo-kzyf, .logo-stem, .logo-lo {
        font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
        font-size: 47px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
    </style>
  </defs>

  <!-- ─── STAR EMBLEM ─────────────────────────────────────────────── -->
  <g transform="translate(8, 10)">
    <!-- Speed Trail Shooting Left -->
    <path d="M 0 38 L 48 38" stroke="#F58220" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 2 34 L 20 34" stroke="#F58220" stroke-width="1.5" opacity="0.6"/>
    <path d="M 2 42 L 24 42" stroke="#F58220" stroke-width="1.5" opacity="0.6"/>

    <!-- Outline Star with Diagonal Cut Effect -->
    <path d="M 52 4 L 62 26 L 86 28 L 68 44 L 74 68 L 52 54 L 30 68 L 36 44 L 18 28 L 42 26 Z" 
          stroke="#F58220" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Dynamic Slice Accent -->
    <path d="M 64 2 L 48 42" stroke="#F58220" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ─── TYPOGRAPHY: kzyfilo (White Syne Luxury Automotive Font) ── -->
  <g transform="translate(108, 57)">
    <!-- kzyf -->
    <text x="0" y="0" class="logo-kzyf" fill="#FFFFFF">kzyf</text>
    
    <!-- i stem -->
    <text x="96" y="0" class="logo-stem" fill="#FFFFFF">ı</text>
    <!-- Inverted Orange Triangle Dot for "i" -->
    <polygon points="98,-38 110,-38 104,-26" fill="#F58220"/>
    
    <!-- lo -->
    <text x="111" y="0" class="logo-lo" fill="#FFFFFF">lo</text>
  </g>
</svg>
