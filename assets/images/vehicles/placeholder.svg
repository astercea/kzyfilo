<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="carBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f6f8"/>
      <stop offset="100%" stop-color="#e3e6ea"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="50%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#carBg)"/>
  
  <!-- Subtle Grid Floor -->
  <path d="M50 420 L750 420 M100 440 L700 440 M150 460 L650 460" stroke="#d5d9de" stroke-width="1.5"/>
  <ellipse cx="400" cy="380" rx="320" ry="25" fill="#000000" opacity="0.15"/>

  <!-- Car Silhouette / Vector Art -->
  <g transform="translate(120, 150)">
    <!-- Main Body -->
    <path d="M 60 170 C 80 170, 110 140, 150 130 C 200 115, 320 110, 390 125 C 440 135, 490 155, 510 170 C 530 185, 535 200, 530 215 C 520 225, 490 230, 480 230 C 470 200, 440 180, 400 180 C 360 180, 330 200, 320 230 L 190 230 C 180 200, 150 180, 110 180 C 70 180, 40 200, 30 230 L 10 230 C 5 215, 10 190, 25 180 C 35 175, 50 170, 60 170 Z" fill="url(#carBody)"/>
    
    <!-- Cabin Windows -->
    <path d="M 170 130 C 210 90, 330 85, 380 120 L 375 125 C 330 100, 220 100, 175 130 Z" fill="#1abc9c" opacity="0.4"/>
    <path d="M 180 125 L 260 98 L 260 125 Z" fill="#ecf0f1" opacity="0.7"/>
    <path d="M 270 98 L 365 98 L 365 125 L 270 125 Z" fill="#ecf0f1" opacity="0.8"/>

    <!-- Headlights & Taillights -->
    <polygon points="500,165 525,175 515,185 490,175" fill="#f1c40f" opacity="0.9"/>
    <polygon points="20,180 10,190 20,195 30,185" fill="#e74c3c" opacity="0.9"/>

    <!-- Front & Rear Wheels -->
    <g transform="translate(110, 230)">
      <circle cx="0" cy="0" r="42" fill="#1e2329"/>
      <circle cx="0" cy="0" r="28" fill="#7f8c8d"/>
      <circle cx="0" cy="0" r="14" fill="#bdc3c7"/>
    </g>
    <g transform="translate(400, 230)">
      <circle cx="0" cy="0" r="42" fill="#1e2329"/>
      <circle cx="0" cy="0" r="28" fill="#7f8c8d"/>
      <circle cx="0" cy="0" r="14" fill="#bdc3c7"/>
    </g>
  </g>

  <!-- Watermark / Brand Badge -->
  <text x="400" y="475" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#9aa1ab" text-anchor="middle" letter-spacing="2">KZY FİLO PREMIUM FLEET</text>
</svg>
