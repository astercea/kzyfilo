<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  
  <!-- Modern Plaza Architecture Silhouette -->
  <g fill="#0f172a">
    <rect x="250" y="80" width="300" height="420" rx="4"/>
    <rect x="120" y="180" width="160" height="320" rx="4"/>
    <rect x="520" y="150" width="180" height="350" rx="4"/>
  </g>
  
  <!-- Windows Grid -->
  <g fill="#f15a24" opacity="0.4">
    <rect x="280" y="120" width="30" height="20" rx="2"/>
    <rect x="330" y="120" width="30" height="20" rx="2"/>
    <rect x="380" y="120" width="30" height="20" rx="2"/>
    <rect x="430" y="120" width="30" height="20" rx="2"/>
    <rect x="480" y="120" width="30" height="20" rx="2"/>
    
    <rect x="280" y="160" width="30" height="20" rx="2"/>
    <rect x="330" y="160" width="30" height="20" rx="2"/>
    <rect x="380" y="160" width="30" height="20" rx="2"/>
    <rect x="430" y="160" width="30" height="20" rx="2"/>
    <rect x="480" y="160" width="30" height="20" rx="2"/>
  </g>
  
  <text x="400" y="470" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">KUZEY PLAZA GENEL MERKEZ</text>
</svg>
